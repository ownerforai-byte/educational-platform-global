# Firebase App Hosting — Next.js 16 SSR (Vercel migration target)
# Env: prefer Console overrides for secrets; NEXT_PUBLIC_* are safe in RUNTIME.
runConfig:
  cpu: 2
  memoryMiB: 4096
  minInstances: 0
  # asia-southeast1 Cloud Run quota: 20 vCPU/project — 2 CPU × 10 instances max.
  maxInstances: 10
  concurrency: 80

# Build/run: use package.json (`apphosting:build`, `start`). runCommand is set
# ON PURPOSE (owner 2026-11-26 outage): with no runCommand the container fell
# back to the ROOT package.json `start`, which starts the BACKEND workspace
# (`node backend/dist/index.js` — a build artifact that is not committed), so
# the container exited before listening and every rollout failed with 404s.
# This command is cwd-independent: npm resolves the workspace and runs the
# script with cwd = frontend/, where `.next/standalone` lives.
runCommand: npm run start --workspace=educational-platform-frontend

env:
  - variable: NEXT_PUBLIC_API_URL
    value: https://us-central1-rn01-af00b.cloudfunctions.net/api
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://harindrasah.com.np
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_USE_FIREBASE_AUTH
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBGJm9-JoDwSGp7VAyc_rlsIo6R8NUOO5g
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: rn01-af00b.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: rn01-af00b
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: rn01-af00b.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "906118704805"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:906118704805:web:3f5d4efee58a246bb7e74c
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-MYB98RBWSH
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BLEh5zE6qtwJ7YZxxlwdWkjVLXBzCmIQ-oNQEc3P-b8ZpjuNRa8wuobe2h3HeZgrH3nJYjB0NfUpoWanoXq2MTA
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ACCESS_APPROVAL_REQUIRED
    value: "false"
    availability:
