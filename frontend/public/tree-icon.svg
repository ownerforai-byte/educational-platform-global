<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="canopyMain" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="canopySide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a16207"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: maskable icons get circle-cropped, so the
       sky must reach every edge. -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Soft sun -->
  <circle cx="384" cy="124" r="46" fill="#fde68a" opacity="0.95"/>
  <circle cx="384" cy="124" r="66" fill="#fde68a" opacity="0.35"/>

  <!-- Ground -->
  <ellipse cx="256" cy="452" rx="250" ry="88" fill="#86efac"/>
  <ellipse cx="256" cy="472" rx="196" ry="64" fill="#22c55e"/>

  <!-- Trunk + branches -->
  <path d="M246 430 L246 318 Q246 300 256 292 Q266 300 266 318 L266 430 Z" fill="url(#bark)"/>
  <path d="M250 372 L214 336" stroke="#92400e" stroke-width="13" stroke-linecap="round"/>
  <path d="M262 356 L300 322" stroke="#92400e" stroke-width="13" stroke-linecap="round"/>

  <!-- Canopy clusters -->
  <circle cx="256" cy="212" r="88" fill="url(#canopyMain)"/>
  <circle cx="182" cy="252" r="64" fill="url(#canopySide)"/>
  <circle cx="330" cy="252" r="64" fill="url(#canopySide)"/>
  <circle cx="216" cy="166" r="52" fill="#4ade80"/>
  <circle cx="300" cy="170" r="50" fill="#22c55e"/>
  <circle cx="256" cy="146" r="48" fill="#4ade80"/>

  <!-- Light dapple -->
  <circle cx="230" cy="176" r="16" fill="#bbf7d0" opacity="0.6"/>
  <circle cx="300" cy="226" r="12" fill="#bbf7d0" opacity="0.5"/>
  <circle cx="196" cy="244" r="10" fill="#bbf7d0" opacity="0.4"/>

  <!-- Two drifting leaves -->
  <path d="M368 330 q18 -12 30 4 q-16 12 -30 -4" fill="#22c55e"/>
  <path d="M142 322 q-18 -12 -30 4 q16 12 30 -4" fill="#4ade80"/>
</svg>
