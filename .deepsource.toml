version = 1

test_patterns = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
  "**/*.spec.tsx",
  "**/__tests__/**",
  "frontend/tests/**"
]

# Keep analysis (and Autofix checkout) focused on app code — mirrors `.deepsourceignore`.
exclude_patterns = [
  ".agnes/**",
  ".frontbuff/**",
  ".kilo/**",
  "content/**",
  "frontend/public/data/**",
  "public/**",
  "backend/.ocr-v2/**",
  "backend/kb/**",
  "node_modules/**",
  "**/node_modules/**",
  ".next/**",
  "frontend/.next/**",
  "backend/dist/**",
  "frontend/lib/deploy-version.ts",
  "*.min.js",
  "*.map",
  "play-store/**",
  "android-twa/**",
  "frontend/scripts/**",
  "scripts/**"
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  dialect = "typescript"

[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  environment = ["python311"]
