version = 1

# Skip heavy data / content directories to keep analysis fast
exclude_patterns = [
  "content/**",
  "public/**",
  "backend/.ocr-v2/**",
  "backend/kb/**",
  "frontend/public/data/**",
  "visuals-py/**",
  "play-store/**",
  "android-twa/**",
]

[[analyzers]]
name = "python"
enabled = true
