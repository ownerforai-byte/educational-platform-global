# =============================================================================
# Security headers (server/location context)
# Include from the site file: include /etc/nginx/snippets/security-headers.conf;
# NOTE: HSTS is intentionally NOT here — it must only be sent over
# HTTPS, so it lives inside the 443 server block in the site file.

# ---- Content-Type sniffing off ----
add_header X-Content-Type-Options "nosniff" always;

# ---- Frame protection ( same-origin — site is proxied same-host) ----
add_header X-Frame-Options "SAMEORIGIN" always;

# ---- Referrer policy ----
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ---- Permissions policy (be restrictive by default) ----
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# ---- Optional CSP — START commented-out on purpose: Next.js + React Three Fiber
# inject inline scripts/styles; uncomment only after testing thoroughly with:
#   https://your-domain.com  (watch devtools/console for violations)
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;