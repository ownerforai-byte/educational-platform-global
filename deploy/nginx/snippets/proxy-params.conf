# =============================================================================
# Shared reverse-proxy parameters (server/location context)
# Include from the site file:  include /etc/nginx/snippets/proxy-params.conf;
# =============================================================================

# Preserve the scheme/host the client actually used (backend reads X-Forwarded-*)
proxy_set_header Host              $host;
proxy_set_header X-Real-IP       $remote_addr;
proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Backend AI routes can take a while (Google GenAI upstream) — generous timeout
proxy_connect_timeout 30s;
proxy_send_timeout    300s;  # keepalive writes
proxy_read_timeout    300s;   # upstream response (AI can exceed defaults)

# Buffering
proxy_buffering on;
proxy_buffer_size  8k;
proxy_buffers      16 8k;

# Cookies pass through automatically; keep them intact (auth relies on them)
# NOTE: do NOT add a global `proxy_set_header Connection "upgrade";` here —
# nginx.conf clears `Connection` at the http level to keep upstream keep-alive
# working for normal HTTP traffic. This app uses no WebSockets.