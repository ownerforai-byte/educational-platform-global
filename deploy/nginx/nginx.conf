# =============================================================================
# Educational Platform — master Nginx configuration
# =============================================================================
# Stack proxied behind this server:
#   Next.js  (prod "next start")  -> 127.0.0.1:3000
#   Express API (prod "node dist/index.js") -> 127.0.0.1:3001
#
# Install location: /etc/nginx/nginx.conf
#   Back up the distro default first, then replace (or merge these key blocks).
#
# Author: Claude Cline   |   Hand-off: Claude Code (install/test/run)
# =============================================================================

user  www-data;
worker_processes auto;
pid        /run/nginx.pid;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- request size: backend accepts 15mb JSON bodies; give headroom ----
    client_max_body_size 20m;

    # ---- hide nginx version in Server header/error pages ----
    server_tokens off;

    # ---- logging (include the real client IP via X-Forwarded-For) ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ---- TCP tuning ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ---- upstream keep-alive (HTTP/1.1 so connections reuse; clear Connection) ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ---- http-context snippets (gzip; loaded via conf.d glob) ----
    include /etc/nginx/conf.d/*.conf;

    # ---- enabled site(s) ----
    include /etc/nginx/sites-enabled/*;
}