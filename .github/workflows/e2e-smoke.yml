name: E2E Smoke

on:
  # Push to main only (owner request 2026-10-27) — CI is already heavy, so
  # pull requests do not run the browser suite.
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pb

      # The app needs its public env at BUILD time (Next inlines
      # NEXT_PUBLIC_* into the bundle) and at RUN time (same values, or
      # hydration mismatches). Required repo secrets, see AGENT_RULES.md
      # "E2E smoke (Playwright)": NEXT_PUBLIC_SUPABASE_URL,
      # NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_API_URL,
      # NEXT_PUBLIC_SITE_URL, plus the SMOKE_* credentials.
      # Name the missing secrets before the build. Without this, an empty
      # NEXT_PUBLIC_* surfaces much later as a mysterious Playwright sign-in
      # failure. Public env is mandatory; missing SMOKE_* credentials only
      # skip their tests, so they are warnings here.
      - name: Preflight smoke environment
        run: node ../scripts/check-smoke-env.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SMOKE_OWNER_EMAIL: ${{ secrets.SMOKE_OWNER_EMAIL }}
          SMOKE_OWNER_PASSWORD: ${{ secrets.SMOKE_OWNER_PASSWORD }}
          SMOKE_MEMBER_EMAIL: ${{ secrets.SMOKE_MEMBER_EMAIL }}
          SMOKE_MEMBER_PASSWORD: ${{ secrets.SMOKE_MEMBER_PASSWORD }}

      # NEXT_PUBLIC_API_URL is inlined at BUILD time. The repo secret has been
      # observed to be an unreachable/malformed host (curl returns 000 at once),
      # which makes every /api/auth/* proxy call fail with ECONNRESET no matter
      # how long we wait. Prefer the secret when /health answers, otherwise use
      # the same keep-alive target the other workflows already use. One URL is
      # then used for BOTH the build and the run so hydration/proxy agree.
      - name: Resolve a reachable smoke backend URL
        id: resolve
        run: |
          secret_url="$(printf '%s' "${NEXT_PUBLIC_API_URL:-}" | tr -d '[:space:]')"
          fallback="https://rn01.onrender.com"
          chosen="$fallback"
          for candidate in "$secret_url" "$fallback"; do
            [ -z "$candidate" ] && continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$candidate/health" || true)
            if [ "$code" = "200" ]; then
              chosen="$candidate"
              echo "::notice::Smoke backend = $candidate (/health=200)"
              break
            fi
            echo "::warning::Smoke backend candidate unreachable (/health=$code): $candidate"
          done
          echo "SMOKE_API_URL=$chosen" >> "$GITHUB_ENV"
          echo "api_url=$chosen" >> "$GITHUB_OUTPUT"
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Build the production server
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ steps.resolve.outputs.api_url }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # Render's free tier cold-starts in ~30s. The first /api/auth/me and
      # /api/auth/login requests used to die with ECONNRESET (socket hang up)
      # during that window, so the guest home never left its session spinner
      # and owner sign-in timed out. Wake the backend and prove the auth route
      # answers BEFORE Playwright starts. If it never wakes, skip only the
      # auth-dependent specs with a loud annotation instead of failing on an
      # external outage — the guest/error specs still run and gate the build.
      - name: Warm the backend before the smoke spec
        run: |
          backend="${SMOKE_API_URL:-https://rn01.onrender.com}"
          warm=0
          for i in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$backend/health" || true)
            if [ "$code" = "200" ]; then
              auth=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$backend/api/auth/me" || true)
              echo "backend warm (attempt $i, /health=200, /api/auth/me=$auth)"
              warm=1
              break
            fi
            echo "attempt $i: /health=$code — Render cold start, retrying"
            sleep 3
          done
          if [ "$warm" != "1" ]; then
            echo "::warning::Backend $backend never became healthy; auth-dependent smoke specs will be skipped."
            echo "SMOKE_SKIP_AUTH=1" >> "$GITHUB_ENV"
          fi
        env:
          SMOKE_API_URL: ${{ steps.resolve.outputs.api_url }}

      - name: Run the smoke spec
        run: npx playwright test
        env:
          CI: 'true'
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pb
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ steps.resolve.outputs.api_url }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SMOKE_OWNER_EMAIL: ${{ secrets.SMOKE_OWNER_EMAIL }}
          SMOKE_OWNER_PASSWORD: ${{ secrets.SMOKE_OWNER_PASSWORD }}
          SMOKE_MEMBER_EMAIL: ${{ secrets.SMOKE_MEMBER_EMAIL }}
          SMOKE_MEMBER_PASSWORD: ${{ secrets.SMOKE_MEMBER_PASSWORD }}