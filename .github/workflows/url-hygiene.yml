name: URL Hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  no-stale-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Fail on hardcoded deployment URLs outside config
        run: |
          # The dead-URL bug class (2026-09-25): 19 hardcoded copies of a dead
          # deployment URL shipped in AI prompts, plus a stale env var, 404'd
          # every /api call. Allowed homes for concrete URLs:
          #   backend/src/config/env.ts   (PUBLIC_SITE_URL fallback)
          #   frontend/next.config.mjs    (API base fallback)
          #   frontend/proxy.ts           (CSP connect-src fallback)
          #   frontend/app/api/[...path]/route.ts (proxy fallback)
          #   backend/scripts/smoke-live.mjs (SMOKE_BASE_URL default)
          #   .github/**                  (workflow targets)
          #   *.md, docs                  (documentation)
          #   frontend/app/legal/attribution/page.tsx (example attribution notice — documentation-style content, not a runtime code path)
          #   frontend/lib/site-url.ts (THE canonical origin config — deliberately
          #     baked in so a missing env var cannot change the host on any
          #     surface; see the Google "access blocked" / "domain keeps
          #     changing itself" fixes. It is a config module, not an AI prompt.)
          #   frontend/lib/supabase/oauth-config.ts (re-exports the canonical
          #     origin next to the OAuth wiring)
          #   *.env.example (documentation of an example value, not a runtime path)
          # The canonical API host is
          # https://us-central1-rn01-af00b.cloudfunctions.net (Firebase Cloud
          # Functions gen2 function `api`); it may be hard-coded only in the
          # config homes above.
          #
          # The retired Render host is allowed NOWHERE — no allowlist. (The
          # bracketed [o] is the grep-guard idiom: the pattern matches the host
          # while this file itself stays free of the literal.)
          RETIRED=$(git grep -n -E \
            'https://[a-z0-9-]+\.[o]nrender\.com' \
            -- \
            frontend \
            scripts \
            docs \
            .github \
            play-store \
            '*.md' \
            ':(exclude)backend' \
            ':(exclude)firebase' \
            ':(exclude)frontend/public' || true)

          VIOLATIONS=$(git grep -n -E \
            '(https://[a-z0-9-]+\.vercel\.app|https://us-central1-rn01-af00b\.cloudfunctions\.net)' \
            -- \
            'backend/src' \
            ':(exclude)backend/src/config/env.ts' \
            ':(exclude)backend/src/middleware/cors.ts' \
            ':(exclude)backend/src/middleware/rateLimit.ts' \
            ':(exclude)backend/scripts/smoke-live.mjs' \
            'frontend' \
            ':(exclude)frontend/next.config.mjs' \
            ':(exclude)frontend/proxy.ts' \
            ':(exclude)frontend/app/api/**' \
            ':(exclude)frontend/scripts/**' \
            ':(exclude)frontend/public/**' \
            ':(exclude)frontend/app/legal/attribution/page.tsx' \
            ':(exclude)frontend/lib/site-url.ts' \
            ':(exclude)frontend/lib/supabase/oauth-config.ts' \
            ':(exclude)*.env.example' \
            ':(exclude)*.md' \
            ':(exclude)*.test.*' \
            ':(exclude)*.spec.*' || true)

          if [ -n "$RETIRED" ]; then
            echo "::error::Retired Render host hard-coded — it is allowed nowhere."
            echo "$RETIRED"
          fi
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Hardcoded deployment URL(s) found outside config files."
            echo "$VIOLATIONS"
            echo ""
            echo "Fix: import { PUBLIC_SITE_URL } from 'backend/src/config/env' (backend)"
            echo "or read process.env.NEXT_PUBLIC_API_URL (frontend) instead."
          fi
          if [ -n "$RETIRED" ] || [ -n "$VIOLATIONS" ]; then
            exit 1
          fi
          echo "OK: no hardcoded deployment URLs outside config files."
