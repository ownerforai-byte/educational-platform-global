name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install renderctl
        run: |
          curl -Ls https://raw.githubusercontent.com/render-oss/renderctl/main/install.sh | bash

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          renderctl apply render.yaml --dry-run || true
          renderctl apply render.yaml
