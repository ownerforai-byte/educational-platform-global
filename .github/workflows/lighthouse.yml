name: Lighthouse CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # PHASE 4.3 (2026-10-27): Lighthouse CI gate on the main routes against
      # the local production build. Budgets in frontend/lighthouserc.json are
      # deliberately generous for mobile emulation (4x CPU throttle) — the
      # gate fails only on a HARD regression (broken page, layout explosion,
      # bundle catastrophe), never on normal metric noise. Lab runs cannot
      # measure INP (a field metric), so total-blocking-time is asserted as
      # its lab proxy.
      - name: Build the production server
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Start the production server
        run: |
          npx next start -p 3000 > /tmp/next-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/home; then
              echo "server ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/next-server.log
          exit 1

      - name: Run Lighthouse CI budgets
        # @lhci/cli is intentionally NOT a local devDependency (its release 0.15.1
        # drags in deprecated rimraf/glob/inflight/uuid that pollute every local
        # `npm install` with deprecation warnings). Fetch it on demand instead;
        # 0.15.1 is the latest published and is frozen.
        #
        # Lighthouse is inherently flaky on CI: under 4x CPU throttling the
        # Chrome/Lighthouse protocol intermittently crashes one run with
        # ERRORED_DOCUMENT_REQUEST (a transient 429 from next-start under rapid
        # parallel resource loading), which exits the whole collect step with
        # code 1. The budgets themselves are generous and use optimistic
        # aggregation, so a genuine regression still fails — but a single
        # flaky crash should not. Retry the autorun up to 2 extra times; the
        # .lighthouseci/ artifacts from a crashed run are overwritten by the
        # next attempt.
        run: |
          for attempt in 1 2 3; do
            echo "::group::Lighthouse attempt $attempt"
            if npx --yes -p @lhci/cli@0.15.1 lhci autorun --config=./lighthouserc.json; then
              echo "::endgroup::"
              echo "Lighthouse passed on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            echo "Lighthouse attempt $attempt failed; retrying..." >&2
            # Brief cool-down so next-start clears any transient backpressure.
            sleep 5
          done
          echo "::error::Lighthouse failed all 3 attempts."
          exit 1
