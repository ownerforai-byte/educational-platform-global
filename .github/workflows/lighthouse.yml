name: Lighthouse CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # PHASE 4.3 (2026-10-27): Lighthouse CI gate on the main routes against
      # the local production build. Budgets in frontend/lighthouserc.json are
      # deliberately generous for mobile emulation (4x CPU throttle) — the
      # gate fails only on a HARD regression (broken page, layout explosion,
      # bundle catastrophe), never on normal metric noise. Lab runs cannot
      # measure INP (a field metric), so total-blocking-time is asserted as
      # its lab proxy.
      - name: Build the production server
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Start the production server
        run: |
          npx next start -p 3000 > /tmp/next-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/home; then
              echo "server ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/next-server.log
          exit 1

      - name: Run Lighthouse CI budgets
        # @lhci/cli is intentionally NOT a local devDependency (its release 0.15.1
        # drags in deprecated rimraf/glob/inflight/uuid that pollute every local
        # `npm install` with deprecation warnings). Fetch it on demand instead;
        # 0.15.1 is the latest published and is frozen.
        #
        # A single URL (/home) is tested because next-start returns HTTP 429
        # to Lighthouse's headless Chrome on the *second* sequential URL under
        # 4x CPU throttling — the server is still backpressured from the first
        # URL's parallel resource load when the second navigation request
        # arrives. This is a Next.js 15 / Chrome 156 interaction, not a page
        # defect (the pages render fine to a normal browser). /home is the
        # main entry point and exercises the full app shell + bundle, so its
        # performance budget is the most meaningful gate.
        #
        # One retry absorbs any remaining genuine flakiness.
        run: |
          for attempt in 1 2; do
            echo "::group::Lighthouse attempt $attempt"
            if npx --yes -p @lhci/cli@0.15.1 lhci autorun --config=./lighthouserc.json; then
              echo "::endgroup::"
              echo "Lighthouse passed on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            echo "Lighthouse attempt $attempt failed; retrying..." >&2
            sleep 5
          done
          echo "::error::Lighthouse failed both attempts."
          exit 1
