name: Live Smoke Test

on:
  # After every push to main, verify the deployed backend is healthy and
  # behaving (backend deploys are manual, so this checks the live deployment
  # rather than waiting for the pushed revision to roll out).
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Run live smoke test (verifies the deployed backend)
        working-directory: backend
        env:
          SMOKE_BASE_URL: https://us-central1-rn01-af00b.cloudfunctions.net/api
          SMOKE_OWNER_EMAIL: ${{ secrets.SMOKE_OWNER_EMAIL }}
          SMOKE_OWNER_PASSWORD: ${{ secrets.SMOKE_OWNER_PASSWORD }}
          CI: "true"
        run: node scripts/smoke-live.mjs

      # Every note the registry claims must actually be served by the deployed
      # site, byte for byte. This is the gate that stops a page promising content
      # that was deleted, renamed or regenerated as a template.
      - name: Content ledger live scan
        run: node scripts/build/content-ledger-live.mjs
