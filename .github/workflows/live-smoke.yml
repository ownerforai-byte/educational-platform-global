name: Live Smoke Test

on:
  # After every push to main, wait until Render has actually deployed the
  # triggering revision, then verify the deployed backend.
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Run live smoke test (polls until the pushed revision is live)
        working-directory: backend
        env:
          SMOKE_BASE_URL: https://rn01.onrender.com
          SMOKE_EXPECTED_COMMIT: ${{ github.sha }}
          SMOKE_OWNER_EMAIL: ${{ secrets.SMOKE_OWNER_EMAIL }}
          SMOKE_OWNER_PASSWORD: ${{ secrets.SMOKE_OWNER_PASSWORD }}
          CI: "true"
        run: node scripts/smoke-live.mjs
