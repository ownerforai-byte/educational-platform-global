name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # CodeRabbit (CWE-522): pull_request workflows run untrusted fork
          # code. Never leave a write-capable token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The 7 React Compiler rules are warnings (legacy backlog), so `npm run
      # lint` alone cannot stop new ones. The ratchet fails on any increase
      # over scripts/lint-ratchet-baseline.json; fixing findings lowers the
      # ceiling permanently. See scripts/lint-ratchet.mjs.
      - name: Enforce the React Compiler lint ratchet
        run: node ../scripts/lint-ratchet.mjs
      # The offline app shell must follow the App Router tree, not a stale
      # hand-written list that misses newly added pages.
      - name: Check service worker precache drift
        run: npm run sw:precache:check
      # No NEW 🚧 placeholder page may ship. The 26 existing ones are
      # baselined in scripts/dead-end-baseline.json and can only go down.
      - name: Enforce the dead-end route ratchet
        run: node ../scripts/dead-end-ratchet.mjs

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # CodeRabbit (CWE-522): pull_request workflows run untrusted fork
          # code. Never leave a write-capable token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # The exact Vercel production build (and its HTTP viability smoke test) is
  # gated once in .github/workflows/upgrade-and-test.yml. Keeping a second
  # copy here only doubled CI minutes, so this job was folded into that one.

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # CodeRabbit (CWE-522): pull_request workflows run untrusted fork
          # code. Never leave a write-capable token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run

  # Sentry sourcemaps (PHASE 1.2, 2026-10-27): the actual upload happens
  # automatically inside the Vercel production build — @sentry/nextjs reads
  # SENTRY_AUTH_TOKEN/SENTRY_ORG/SENTRY_PROJECT from the Vercel env and pushes
  # sourcemaps for the release. GitHub CI cannot upload for Vercel builds, so
  # this job verifies the wiring instead: the gated init files, the env
  # plumbing, and a working sentry-cli. The wiring check always runs; only the
  # token-dependent sentry-cli step is gated — a missing secret must never
  # fail CI. (The `secrets` context is not allowed in job-level `if`, which
  # is why the gate lives on the step.)
  sentry-sourcemaps:
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # CodeRabbit (CWE-522): pull_request workflows run untrusted fork
          # code. Never leave a write-capable token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: |
          grep -q "Sentry.init" instrumentation.ts
          grep -q "Sentry.init" instrumentation-client.ts
          grep -q "NEXT_PUBLIC_SENTRY_DSN" .env.example
          grep -q "SENTRY_DSN" .env.example
          echo "Sentry wiring OK"
      - name: Verify sentry-cli against the org
        if: env.SENTRY_AUTH_TOKEN != ''
        run: npx @sentry/cli@latest --version

  # Baseline-ratchet gate: fails on NEW schema violations + manifest drift.
  # Uses root tsx (backend lockfile has no zod/tsx to hoist into backend/);
  # schema files are imported relatively so this works from the repo root.
  content-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CodeRabbit (CWE-522): pull_request workflows run untrusted fork
          # code. Never leave a write-capable token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The validator (like the parity build below) imports the content schemas,
      # which need zod from frontend/node_modules — so install frontend deps
      # before running it.
      - run: cd frontend && npm ci
      - run: npx tsx frontend/scripts/content/validate.ts --strict
      # Parity gate (PLANS.md §5.1): the built tree must match the corpus
      # byte-for-byte.
      - run: npx tsx frontend/scripts/content/build.ts --check
      # Visual audit: every syllabus unit's branch tree and every topic's
      # drawing must be about its OWN topic, with content traceable to that
      # unit's own sources. Exits non-zero on any high finding.
      - run: npm run audit:visuals
      # The legacy mindmap branch files must stay rebuilt from their unit's own
      # concept notes (no scaffold, no empty branch, no filler).
      - run: npm run mindmaps:check
      # Content ledger: every note the site claims must be registered, shipped
      # and un-drifted, and a note that was authored must not silently become a
      # generated template. Live presence is proven separately (live-smoke.yml).
      - run: npm run ledger:check
      # Mobile rules from MOBILE_RESPONSIVE_CHECKLIST.md that can be enforced
      # mechanically: invalid variants, safe-area chrome, wide minimums, tables.
      - run: npm run mobile:check
      # Veer's golden regression set must stay in sync with the PYQ corpus it
      # was sampled from. Offline gate: no keys, no network, no AI credits.
      - run: npm run ai:regression

  # Android Deep Link gate: the Digital Asset Links file must be JSON,
  # match the Play-registered package, and declare at least one SHA-256
  # fingerprint. The host/segment fields must also match the PWA manifest's
  # origin and the play-store release bundle path, so new store releases
  # catch assetlink mismatches before the AAB is uploaded.
  assetlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CodeRabbit (CWE-522): pull_request workflows run untrusted fork
          # code. Never leave a write-capable token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: |
          npx tsx <<'EOF'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const appDir = process.cwd();
          const assetlinksPath = path.join(appDir, 'frontend/public/.well-known/assetlinks.json');
          const manifestPath = path.join(appDir, 'frontend/public/manifest.json');
          const aabPath = path.join(appDir, 'play-store/ravikisan-platform-release.aab');

          const ASSETLINKS_PACKAGE = 'com.ravikisan.platform';
          const ASSETLINKS_HOST = 'ravikisan.vercel.app';
          const ASSETLINKS_ORIGIN = `https://${ASSETLINKS_HOST}`;

          console.log(`Verifying assetlinks for ${ASSETLINKS_PACKAGE} on ${ASSETLINKS_ORIGIN}`);

          const assetlinksText = await fs.readFile(assetlinksPath, 'utf8');
          const assetlinks = JSON.parse(assetlinksText);

          const entry = assetlinks.find((entry) =>
            entry.target?.namespace === 'android_app' &&
            entry.target?.package_name === ASSETLINKS_PACKAGE
          );
          if (!entry) {
            throw new Error(`No assetlinks entry for package ${ASSETLINKS_PACKAGE}`);
          }

          if (!entry.relation || !Array.isArray(entry.relation)) {
            throw new Error('assetlinks entry is missing a relation array');
          }
          if (!entry.relation.includes('delegate_permission/common.handle_all_urls')) {
            throw new Error('assetlinks entry must declare delegate_permission/common.handle_all_urls');
          }

          if (!entry.target?.sha256_cert_fingerprints || !Array.isArray(entry.target.sha256_cert_fingerprints)) {
            throw new Error('assetlinks entry target must include sha256_cert_fingerprints');
          }
          if (entry.target.sha256_cert_fingerprints.length === 0) {
            throw new Error('assetlinks entry target must declare at least one SHA-256 fingerprint');
          }

          const currentFingerprints = entry.target.sha256_cert_fingerprints
            .map((f) => (typeof f === 'string' ? f.toUpperCase() : ''))
            .filter(Boolean);

          // Audited against META-INF/RAVIKISA.RSA in the checked-in release AAB
          // on 2026-10-30. New certificates must be verified before being added.
          const verifiedFingerprints = [
            '5BF3921CD99DC1E7EB31CDCB26923857F66733EA609C29D747E1A7ED85C5E390',
          ];

          for (const fingerprint of currentFingerprints) {
            if (!verifiedFingerprints.includes(fingerprint)) {
              throw new Error(
                `Unverified SHA-256 fingerprint in assetlinks.json: ${fingerprint}`
              );
            }
          }

          if (verifiedFingerprints.length === 0) {
            throw new Error('No verified SHA-256 fingerprints are configured for assetlinks.json');
          }

          if (!currentFingerprints.includes(verifiedFingerprints[0])) {
            throw new Error(
              `assetlinks.json is missing the verified fingerprint ${verifiedFingerprints[0]}`
            );
          }

          console.log(`Verified fingerprints: ${verifiedFingerprints.join(', ')}`);

          const manifestText = await fs.readFile(manifestPath, 'utf8');
          const manifest = JSON.parse(manifestText);

          // The PWA intentionally starts on the tier home (/home), not the
          // site root. Accept both so a deliberate start_url change does not
          // fail the source-level assetlinks gate.
          if (
            !['/', '/home'].includes(manifest?.start_url) ||
            manifest?.display !== 'standalone' ||
            manifest?.orientation !== 'portrait-primary'
          ) {
            throw new Error('manifest.json origin/standalone metadata drifted from assetlinks host');
          }

          const manifestRelation = manifest?.related_applications?.some((app) =>
            app?.platform === 'play' && app?.id === ASSETLINKS_PACKAGE
          );
          if (manifestRelation !== true) {
            throw new Error(
              'manifest.json does not declare the expected play companion app'
            );
          }

          // Release binaries are produced by release tooling and are no longer
          // tracked in git (f6419cf). Their absence must not fail a source-level
          // gate; the fingerprint + manifest assertions above still apply.
          try {
            const aabStat = await fs.stat(aabPath);
            console.log(`Release AAB present: ${aabPath} (${(aabStat.size / 1024).toFixed(1)} KB)`);
          } catch {
            console.log(`::warning::Release AAB not checked in (${aabPath}); fingerprint/manifest gates still enforced.`);
          }

          console.log('assetlinks OK');
          EOF
