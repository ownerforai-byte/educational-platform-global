name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run

  # Baseline-ratchet gate: fails on NEW schema violations + manifest drift.
  # Uses root tsx (backend lockfile has no zod/tsx to hoist into backend/);
  # schema files are imported relatively so this works from the repo root.
  content-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsx frontend/scripts/content/validate.ts --strict
      # Parity gate (PLANS.md §5.1): the built tree must match the corpus
      # byte-for-byte. Needs frontend/node_modules for zod — install it first.
      - run: cd frontend && npm ci
      - run: npx tsx frontend/scripts/content/build.ts --check
      # Visual audit: every syllabus unit's branch tree and every topic's
      # drawing must be about its OWN topic, with content traceable to that
      # unit's own sources. Exits non-zero on any high finding.
      - run: npm run audit:visuals
      # The legacy mindmap branch files must stay rebuilt from their unit's own
      # concept notes (no scaffold, no empty branch, no filler).
      - run: npm run mindmaps:check
      # Content ledger: every note the site claims must be registered, shipped
      # and un-drifted, and a note that was authored must not silently become a
      # generated template. Live presence is proven separately (live-smoke.yml).
      - run: npm run ledger:check

  frontend-build:
    needs: [frontend-lint, frontend-typecheck, frontend-test, content-schema]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 1

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:run

  backend-build:
    needs: [backend-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 1

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: [frontend-build, backend-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: [frontend-build, backend-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Trigger Render deploy (deploy hook)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping deploy trigger"
          fi
