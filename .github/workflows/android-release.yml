name: Android release
on:
  pull_request:
    paths: ['android-twa/**', 'frontend/public/.well-known/assetlinks.json', '.github/workflows/android-release.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Upload signed bundle to Play internal testing (requires completed owner setup)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: bash gradlew :app:lintRelease :app:assembleDebug
        working-directory: android-twa/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-verification
          path: |
            android-twa/android/app/build/reports/lint-results-release.*
            android-twa/android/app/build/outputs/apk/debug/*.apk
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: google-play
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify live Play signing association
        env:
          PLAY_APP_SIGNING_SHA256: ${{ vars.PLAY_APP_SIGNING_SHA256 }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re, urllib.parse, urllib.request
          fingerprint = os.environ.get('PLAY_APP_SIGNING_SHA256', '')
          if not re.fullmatch(r'(?:[0-9A-F]{2}:){31}[0-9A-F]{2}', fingerprint):
              raise SystemExit('Configure PLAY_APP_SIGNING_SHA256 from Play App integrity')
          query = urllib.parse.urlencode({
              'source.web.site': 'https://ravikisan.vercel.app',
              'target.androidApp.packageName': 'com.ravikisan.platform',
              'target.androidApp.certificate.sha256Fingerprint': fingerprint,
              'relation': 'delegate_permission/common.handle_all_urls',
          })
          with urllib.request.urlopen('https://digitalassetlinks.googleapis.com/v1/assetlinks:check?' + query, timeout=30) as response:
              result = json.load(response)
          if result.get('linked') is not True:
              raise SystemExit('Live Digital Asset Links verification failed; deploy the Play signing certificate first')
          PYCODE
      - name: Build signed bundle
        working-directory: android-twa/android
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          bash gradlew :app:lintRelease :app:bundleRelease
          jarsigner -J-Duser.language=en -verify app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/signature-check.txt"
          grep -q "jar verified" "$RUNNER_TEMP/signature-check.txt"
          curl --fail --location --retry 2 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-bundle
          path: android-twa/android/app/build/outputs/bundle/release/*.aab
      - name: Upload to internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ravikisan.platform
          releaseFiles: android-twa/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
