# Automated dependency tracking & security upgrades.
#
# Primary ecosystem: npm / Node.js + TypeScript (package-lock.json plus the
# /frontend lockfile; /backend is an npm workspace of the root). Python is only
# used by the offline visual-generation tooling (requirements.txt), so it is
# deliberately not tracked here.
#
# Policy:
#   * weekly version updates for every npm manifest;
#   * at most 5 open PRs per ecosystem (open-pull-requests-limit: 5);
#   * minor/patch updates are grouped into one reviewable PR per directory,
#     while SECURITY updates stay individual and bypass the open-PR limit so a
#     critical advisory is never queued behind routine bumps;
#   * framework/toolchain majors are upgraded by hand (see ignore rules) —
#     they need a coordinated Node/Next/TypeScript migration.
version: 2
updates:
  # Root workspace (shared scripts, content-tools, backend workspace)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "automated"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pin major versions of core framework deps — upgrade manually
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Toolchain majors must be upgraded by hand: vitest 5, TypeScript 7 and
      # @types/node 26 all break `tsc --noEmit` / `next build` on Node 22 and
      # produced failing Vercel preview deployments for the bot branches.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Frontend (Next.js)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend", "automated"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Backend (Express + TypeScript)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend", "automated"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci", "automated"]
