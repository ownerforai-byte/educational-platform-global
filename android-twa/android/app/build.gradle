/*
 * Standalone native shell — Ravikisan Platform (Play package com.ravikisan.platform).
 */

plugins {
    id 'com.android.application'
}

def googleServicesJson = file("google-services.json")
if (googleServicesJson.exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def releaseKeystore = null
def keystorePropsFile = new File(rootProject.projectDir, 'key.properties')
if (keystorePropsFile.exists()) {
    def kp = new Properties()
    keystorePropsFile.withInputStream { kp.load(it) }
    def ksPath = kp['storeFile']
    releaseKeystore = [
        storeFile     : new File(rootProject.projectDir, ksPath).getCanonicalFile(),
        storePassword : kp['storePassword'],
        keyAlias      : kp['keyAlias'],
        keyPassword   : kp['keyPassword']
    ]
} else {
    logger.warn('android/key.properties missing — release AAB will be unsigned until configured.')
}

android {
    compileSdkVersion 36
    namespace "com.ravikisan.platform"
    buildFeatures {
        buildConfig true
    }
  if (releaseKeystore != null) {
        signingConfigs {
            release {
                storeFile      releaseKeystore.storeFile
                storePassword  releaseKeystore.storePassword
                keyAlias       releaseKeystore.keyAlias
                keyPassword    releaseKeystore.keyPassword
                v2SigningEnabled true
            }
        }
    }
    defaultConfig {
        applicationId "com.ravikisan.platform"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode 17
        versionName "1.0.15"
        buildConfigField "String", "API_BASE", '"https://harindrasah.com.np"'
        resValue "string", "appName", "Ravikisan\\'s Platform"
        resValue "string", "launcherName", "Ravikisan"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

def configuredTargetSdk = (findProperty('twaTargetSdk') ?: '36') as int
if (configuredTargetSdk < 36) {
    throw new GradleException('twaTargetSdk must be at least 36 for current Play submissions.')
}
android.defaultConfig.targetSdkVersion configuredTargetSdk

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
}